# SPDX-License-Identifier: GPL-3.0-or-later
name: Patch Wi-Fi WebUI enum tests and global radio policy

on:
  push:
    paths:
      - '.github/workflows/patch-wifi-webui-enum-tests-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/patch_wifi_webui_enum_tests_policy_once.py
      - run: |
          python -m pip install -e '.[test]'
          pytest
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md tests/integration/test_wifi_field_writes.py CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Add global radio policy and Wi-Fi WebUI enum tests'
          git push
