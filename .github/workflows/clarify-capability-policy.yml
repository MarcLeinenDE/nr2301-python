# SPDX-License-Identifier: GPL-3.0-or-later
name: Clarify SDK capability policy

on:
  push:
    paths:
      - '.github/workflows/clarify-capability-policy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clarify capability policy and record DNS validation
        run: python tools/clarify_capability_policy_once.py
      - name: Run offline tests
        run: |
          python -m pip install -e ".[test]"
          pytest
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Clarify complete SDK capability policy'
          git push
