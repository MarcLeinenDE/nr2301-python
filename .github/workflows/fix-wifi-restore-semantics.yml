# SPDX-License-Identifier: GPL-3.0-or-later
name: Fix Wi-Fi restore semantics

on:
  push:
    paths:
      - '.github/workflows/fix-wifi-restore-semantics.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_wifi_restore_semantics_once.py
      - run: python -m py_compile examples/explore_wifi_security_matrix.py tests/integration/test_wifi_field_writes.py tests/integration/test_wifi_extended_writes.py
      - name: Commit restore semantics fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/test_wifi_field_writes.py tests/integration/test_wifi_extended_writes.py CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Correct Wi-Fi restore semantics'
          git push
