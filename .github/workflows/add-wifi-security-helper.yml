# SPDX-License-Identifier: GPL-3.0-or-later
name: Add Wi-Fi security helper

on:
  push:
    paths:
      - '.github/workflows/add-wifi-security-helper.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/add_wifi_security_helper_once.py
      - run: python -m pytest tests/test_wifi_namespace.py tests/test_wifi_redaction.py -q
      - run: python -m py_compile src/nr2301/namespaces/wifi.py
      - name: Commit Wi-Fi security helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nr2301/namespaces/wifi.py tests/test_wifi_namespace.py CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Expose live-verified Wi-Fi security controls'
          git push
