# SPDX-License-Identifier: GPL-3.0-or-later
name: Patch Wi-Fi field testing

on:
  push:
    paths:
      - '.github/workflows/patch-wifi-field-testing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Wi-Fi field testing
        run: python tools/patch_wifi_field_testing_once.py
      - name: Test
        run: |
          python -m pip install -e '.[test]'
          pytest
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nr2301/namespaces/wifi.py tests/integration/test_wifi_field_writes.py tests/test_wifi_redaction.py CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Harden Wi-Fi write diagnostics and field tests'
          git push
