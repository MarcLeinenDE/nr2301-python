# SPDX-License-Identifier: GPL-3.0-or-later
name: Record SIM provide-PIN evidence

on:
  push:
    paths:
      - '.github/workflows/record-sim-provide-pin-evidence.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/record_sim_provide_pin_evidence_once.py
      - name: Commit SDK evidence docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/integration-testing.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record SIM provide-PIN physical evidence'
          git push
