# SPDX-License-Identifier: GPL-3.0-or-later
name: Record SMS E2E SDK docs

on:
  push:
    paths:
      - '.github/workflows/record-sms-e2e-docs.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/record_sms_e2e_docs_once.py
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Commit SMS E2E documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/integration-testing.md
          git diff --cached --quiet && exit 0
          git commit -m 'Document sanitized SMS SDK E2E evidence'
          git push
