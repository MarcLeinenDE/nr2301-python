# SPDX-License-Identifier: GPL-3.0-or-later
name: Normalize SMS draft helpers

on:
  push:
    paths:
      - '.github/workflows/normalize-sms-draft-helpers.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/normalize_sms_draft_helpers_once.py
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_sms_namespace.py -q
      - name: Commit SDK helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nr2301/namespaces/sms.py tests/test_sms_namespace.py CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Add SMS draft and get-by-id helpers'
          git push
