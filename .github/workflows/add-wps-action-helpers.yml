# SPDX-License-Identifier: GPL-3.0-or-later
name: Add WPS action helpers

on:
  push:
    paths:
      - '.github/workflows/add-wps-action-helpers.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python tools/add_wps_action_helpers_once.py
      - run: python -m pytest tests/test_wifi_namespace.py -q
      - run: python -m py_compile src/nr2301/namespaces/wifi.py tests/integration/test_wps_actions.py
      - name: Commit WPS helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nr2301/namespaces/wifi.py tests/test_wifi_namespace.py tests/integration/test_wps_actions.py CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Expose WPS action helpers'
          git push
