# SPDX-License-Identifier: GPL-3.0-or-later
name: Record WPS physical pass

on:
  push:
    paths:
      - '.github/workflows/record-wps-physical-pass.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/record_wps_physical_pass_once.py
      - name: Commit WPS physical evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/integration-testing.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record successful physical WPS action pass'
          git push
